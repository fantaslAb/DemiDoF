<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
  <meta name="mrbd-web-app-capable" content="yes" />
  <meta name="description" content="DemiDoF: world-anchored content on the head-locked Ray-Ban Display. Turn your head to look across a workspace wider than the 20° window." />
  <meta name="theme-color" content="#000000" />
  <title>DemiDoF</title>
  <link rel="icon" href="assets/icon-96.png" sizes="96x96" type="image/png" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" sizes="180x180" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <style>
    /* Additive waveguide: pure black is transparent, so everything sits on black. */
    :root {
      --accent: #5ad1ff;
      --accent-2: #ffb86b;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.62);
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 600px;
      height: 600px;
      background: #000;
      color: var(--text);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none; /* opt in to drag (read at load only) */
    }
    #gl { position: absolute; left: 0; top: 0; width: 600px; height: 600px; display: block; }

    /* Start screen ------------------------------------------------------- */
    #start {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; padding: 40px;
      background: #000;
    }
    #start.hidden { display: none; }
    #start h1 { font-size: 56px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
    #start h1 span { color: var(--accent); }
    #start p { font-size: 22px; line-height: 1.35; color: var(--muted); margin: 0; max-width: 480px; }
    #start .big {
      font: inherit; font-size: 26px; font-weight: 600; color: #000; background: var(--accent);
      border: 4px solid transparent; border-radius: 22px; min-height: 88px; min-width: 300px; padding: 0 36px;
    }
    #start .big:focus { outline: none; border-color: #fff; box-shadow: 0 0 0 6px rgba(90, 209, 255, 0.35); }

    /* Menu bar ----------------------------------------------------------- */
    #bar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 100px;
      display: flex; gap: 8px; padding: 4px 8px 8px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0));
      transition: transform 160ms ease;
    }
    #bar.hidden { transform: translateY(76px); }
    #bar button {
      flex: 1 1 0; min-height: 88px; min-width: 0;
      border-radius: 18px; padding: 8px 6px 6px;
      background: rgba(255, 255, 255, 0.07); color: var(--text);
      border: 3px solid rgba(255, 255, 255, 0.28);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      font: inherit; line-height: 1.1;
    }
    #bar button small { font-size: 15px; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; }
    #bar button b { font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #bar button:focus { outline: none; border-color: var(--accent); background: rgba(90, 209, 255, 0.16); }
    #bar button:focus b { color: var(--accent); }
    #bar.hidden button { border-color: rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.03); }
    #bar.hidden button:focus { border-color: var(--accent); }

    /* Readout ------------------------------------------------------------ */
    #hud {
      position: absolute; left: 12px; top: 10px;
      font-size: 18px; line-height: 1.3; color: var(--muted);
      pointer-events: none; white-space: pre;
    }
    #hud.hidden { display: none; }
    #hud b { color: var(--text); font-weight: 600; }

    #toast {
      position: absolute; left: 50%; bottom: 112px; transform: translate(-50%, 8px);
      background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 16px; padding: 10px 18px; font-size: 20px; max-width: 540px; text-align: center;
      opacity: 0; transition: opacity 160ms ease, transform 160ms ease; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    #fatal {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 48px; text-align: center; font-size: 24px; line-height: 1.4; background: #000;
    }
    #fatal.show { display: flex; }
  </style>
</head>
<body>
  <canvas id="gl" width="600" height="600"></canvas>

  <div id="hud" class="hidden"></div>
  <div id="toast" role="status"></div>

  <div id="bar" class="hidden">
    <button id="b-mode" data-focusable><small>Mode</small><b>World</b></button>
    <button id="b-content" data-focusable><small>Content</small><b>Cards</b></button>
    <button id="b-recenter" data-focusable><small>Anchor</small><b>Center</b></button>
    <button id="b-motion" data-focusable><small>Head</small><b>Sensor</b></button>
    <button id="b-frame" data-focusable><small>Axes</small><b>1 / 6</b></button>
    <button id="b-hud" data-focusable><small>Readout</small><b>Off</b></button>
  </div>

  <div id="start">
    <h1>Demi<span>DoF</span></h1>
    <p>Content stays anchored in the world. Turn your head to look across a workspace wider than the display.</p>
    <button id="b-start" class="big" data-focusable>Start</button>
    <p id="start-note">Select to start. Head tracking asks for sensor permission.</p>
  </div>

  <div id="fatal"></div>

  <script type="module" src="src/glasses.js"></script>
</body>
</html>
